<title>IECHM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================= TOKENS ============================= */
:root{
  /* IECHM brand: base #F9F8F6 · neutral #706B67 · accent #E58A45 · contrast #2B1C12 */
  --ink-900:#2B1C12; --ink-700:#4A362A; --ink-600:#5E4736;
  --copper-500:#E58A45; --copper-600:#9C5211; --copper-100:#FBE3CC; --copper-050:#FDF1E5;
  --steel-000:#FFFFFF; --steel-050:#F9F8F6; --steel-100:#F1EEE9; --steel-200:#E4DFD7;
  --steel-300:#CFC7BB; --steel-500:#75705F; --steel-600:#706B67;
  --on-accent:#2B1C12; /* fixed dark brown for text on top of the accent orange, in either theme */
  --success-600:#3F7A4A; --success-100:#E3EFE1;
  --warning-600:#9C6B12; --warning-100:#F5EBD3;
  --teal-600:#1E7A76; --teal-100:#DCEFEE;
  --danger-600:#B23A30; --danger-100:#FAE2DF;
  --bg:var(--steel-050); --surface:var(--steel-000); --surface-alt:var(--steel-100);
  --border:var(--steel-200); --text:var(--ink-900); --text-soft:var(--steel-600); --text-faint:var(--steel-500);
  --brand:var(--ink-700); --accent:var(--copper-500); --accent-bg:var(--copper-100);
  --shadow-sm:0 1px 2px rgba(43,28,18,.07),0 1px 1px rgba(43,28,18,.05);
  --shadow-md:0 8px 24px rgba(43,28,18,.12),0 2px 6px rgba(43,28,18,.07);
  --shadow-lg:0 20px 48px rgba(20,13,8,.30);
  --radius-s:10px; --radius-m:16px; --radius-l:22px; --radius-pill:999px;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Space Grotesk',system-ui,sans-serif;
  --font-mono:'Space Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink-900:#F4EFE9; --ink-700:#DACFC0; --ink-600:#C7B9A6;
    --copper-500:#F2A25F; --copper-600:#FFC48F; --copper-100:#3D2716; --copper-050:#2C1D10;
    --steel-000:#1C150D; --steel-050:#130E09; --steel-100:#261C12; --steel-200:#3A2C1C;
    --steel-300:#513F29; --steel-500:#A89A87; --steel-600:#C7B9A6;
    --success-600:#72C182; --success-100:#1C3223;
    --warning-600:#E1AD4C; --warning-100:#3B2B0E;
    --teal-600:#5AC4BE; --teal-100:#153433;
    --danger-600:#E38076; --danger-100:#3A1A17;
    --bg:var(--steel-050); --surface:var(--steel-000); --surface-alt:var(--steel-100);
    --border:var(--steel-200); --text:var(--ink-900); --text-soft:var(--steel-600); --text-faint:var(--steel-500);
    --brand:var(--ink-700); --accent:var(--copper-500); --accent-bg:var(--copper-100);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 24px rgba(0,0,0,.45); --shadow-lg:0 20px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink-900:#F4EFE9; --ink-700:#DACFC0; --ink-600:#C7B9A6;
  --copper-500:#F2A25F; --copper-600:#FFC48F; --copper-100:#3D2716; --copper-050:#2C1D10;
  --steel-000:#1C150D; --steel-050:#130E09; --steel-100:#261C12; --steel-200:#3A2C1C;
  --steel-300:#513F29; --steel-500:#A89A87; --steel-600:#C7B9A6;
  --success-600:#72C182; --success-100:#1C3223;
  --warning-600:#E1AD4C; --warning-100:#3B2B0E;
  --teal-600:#5AC4BE; --teal-100:#153433;
  --danger-600:#E38076; --danger-100:#3A1A17;
  --bg:var(--steel-050); --surface:var(--steel-000); --surface-alt:var(--steel-100);
  --border:var(--steel-200); --text:var(--ink-900); --text-soft:var(--steel-600); --text-faint:var(--steel-500);
  --brand:var(--ink-700); --accent:var(--copper-500); --accent-bg:var(--copper-100);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 24px rgba(0,0,0,.45); --shadow-lg:0 20px 48px rgba(0,0,0,.6);
}

/* ============================= RESET / BASE ============================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em;}
p{margin:0;}
a{color:inherit;}
::selection{background:var(--accent-bg);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

/* ============================= STAGE (outside the phone) ============================= */
/* Always the dark "system console" surface from the brand hero, independent of the app's own theme. */
.stage{
  --sd-bg:#130E09; --sd-line:rgba(229,138,69,.14); --sd-text:#EFE7DC; --sd-faint:#9C9086;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:56px 16px; position:relative; overflow:hidden;
  background:
    radial-gradient(60% 50% at 50% 8%, rgba(229,138,69,.10), transparent 70%),
    linear-gradient(var(--sd-line) 1px,transparent 1px) 0 0/42px 42px,
    linear-gradient(90deg,var(--sd-line) 1px,transparent 1px) 0 0/42px 42px,
    var(--sd-bg);
}
.stage-inner{display:flex; flex-direction:column; align-items:center; gap:22px; position:relative; z-index:1;}
.stage-brand{display:flex; flex-direction:column; align-items:center; gap:10px;}
.stage-kicker{
  display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--sd-faint);
}
.hazard{width:20px; height:11px; flex:0 0 auto; background-image:repeating-linear-gradient(-45deg,#E58A45 0 3px,transparent 3px 6px);}
.stage-wordmark{font-family:var(--font-display); font-weight:700; font-size:34px; letter-spacing:.01em; color:var(--sd-text);}
.stage-tag{font-family:var(--font-display); font-weight:600; font-size:13px; letter-spacing:.06em; color:#E58A45; text-transform:uppercase;}
.stage-label{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--sd-faint); display:flex; align-items:center; gap:8px;
}
.stage-label .dot{width:6px;height:6px;border-radius:50%;background:#E58A45; box-shadow:0 0 0 3px rgba(229,138,69,.22);}

/* ============================= LOGO MARK (I≡CHM wordmark) ============================= */
.logo-img{height:20px; width:auto; display:inline-block; vertical-align:middle;}
.logo-img--light{display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo-img--dark{display:none;}
  :root:not([data-theme="light"]) .logo-img--light{display:inline-block;}
}
:root[data-theme="dark"] .logo-img--dark{display:none;}
:root[data-theme="dark"] .logo-img--light{display:inline-block;}

/* ============================= PHONE FRAME ============================= */
.phone{
  width:412px; max-width:calc(100vw - 24px); height:860px; max-height:calc(100vh - 110px);
  background:var(--surface); border-radius:44px; box-shadow:var(--shadow-lg);
  border:1px solid var(--border); position:relative; overflow:hidden; display:flex; flex-direction:column;
}
.phone-notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%); width:126px; height:26px;
  background:var(--ink-900); border-radius:0 0 16px 16px; z-index:40;
}
.app{position:relative; flex:1; display:flex; flex-direction:column; min-height:0;}
.statusbar{
  height:26px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; font-family:var(--font-mono); font-size:12px; color:var(--text); background:var(--surface);
}

/* ============================= TOP BAR ============================= */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--surface);
  border-bottom:1px solid var(--border); min-height:52px;
}
.topbar-icon{
  width:34px; height:34px; border-radius:var(--radius-pill); border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto; color:var(--text); cursor:pointer;
}
.topbar-icon:active{background:var(--surface-alt);}
.topbar-title{font-family:var(--font-display); font-weight:700; font-size:17px; flex:1; min-width:0;}
.topbar-sub{font-size:11px; color:var(--text-faint); font-family:var(--font-mono);}
.mode-pill{
  display:flex; align-items:center; gap:6px; padding:7px 12px 7px 8px; border-radius:var(--radius-pill);
  background:var(--surface-alt); border:1px solid var(--border); cursor:pointer; flex:0 0 auto;
}
.mode-pill .swatch{width:20px;height:20px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:11px;}
.mode-pill .lbl{font-weight:600; font-size:13px;}
.mode-pill .car{font-size:9px; color:var(--text-faint);}

/* ============================= SCROLL AREA ============================= */
.screen{flex:1; overflow-y:auto; overflow-x:hidden; background:var(--bg); -webkit-overflow-scrolling:touch;}
.screen::-webkit-scrollbar{width:0;}
.pad{padding:16px;}
.stack{display:flex; flex-direction:column; gap:12px;}
.section{padding:18px 16px 6px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.section-title{font-family:var(--font-display); font-weight:700; font-size:15px;}
.section-link{font-size:12px; color:var(--accent); font-weight:600; cursor:pointer;}
.hscroll{display:flex; gap:10px; overflow-x:auto; padding:2px 16px 10px; scroll-snap-type:x proximity;}
.hscroll::-webkit-scrollbar{display:none;}

/* ============================= BOTTOM NAV ============================= */
.bottomnav{
  flex:0 0 auto; display:flex; background:var(--surface); border-top:1px solid var(--border);
  padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px));
}
.navitem{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 2px; cursor:pointer;
  color:var(--text-faint); background:none; border:none;
}
.navitem svg{width:22px;height:22px;}
.navitem span{font-size:10px; font-weight:600; font-family:var(--font-body);}
.navitem.active{color:var(--accent);}
.navitem.active svg{stroke:var(--accent);}

/* ============================= BUTTONS ============================= */
.btn{
  appearance:none; border:none; cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:14.5px;
  border-radius:var(--radius-m); padding:14px 18px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .08s ease, opacity .12s ease; width:100%;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--ink-700); color:var(--steel-000);}
.btn-accent{background:var(--accent); color:var(--on-accent);}
.btn-secondary{background:var(--surface-alt); color:var(--text); border:1px solid var(--border);}
.btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
.btn-outline-accent{background:var(--accent-bg); color:var(--copper-600); border:1px solid var(--accent);}
.btn-sm{padding:9px 14px; font-size:13px; width:auto; border-radius:var(--radius-s);}
.btn-block-row{display:flex; gap:10px;}
.btn[disabled]{opacity:.45; pointer-events:none;}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}

/* ============================= CARDS ============================= */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow-sm);}
.card-pad{padding:16px;}
.tap{cursor:pointer;}
.tap:active{background:var(--surface-alt);}

/* ============================= CHIPS / STATUS ============================= */
.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 10px 4px 8px;
  border-radius:var(--radius-pill); font-family:var(--font-body); white-space:nowrap;
}
.chip .dot{width:6px;height:6px;border-radius:50%;}
.chip-available{background:var(--success-100); color:var(--success-600);}
.chip-available .dot{background:var(--success-600);}
.chip-similar{background:var(--teal-100); color:var(--teal-600);}
.chip-similar .dot{background:var(--teal-600);}
.chip-custom{background:var(--copper-100); color:var(--copper-600);}
.chip-custom .dot{background:var(--copper-500);}
.chip-info{background:var(--warning-100); color:var(--warning-600);}
.chip-info .dot{background:var(--warning-600);}
.chip-neutral{background:var(--surface-alt); color:var(--text-soft); border:1px solid var(--border);}
.chip-danger{background:var(--danger-100); color:var(--danger-600);}
.chip-danger .dot{background:var(--danger-600);}
.tag{font-size:11px; font-weight:600; color:var(--text-faint); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em;}

/* ============================= FORMS ============================= */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-soft);}
.input,textarea.input,select.input{
  width:100%; border:1.5px solid var(--border); border-radius:var(--radius-s); padding:13px 14px; font-size:14.5px;
  font-family:var(--font-body); background:var(--surface); color:var(--text);
}
textarea.input{resize:vertical; min-height:64px; line-height:1.45;}
.input:focus{border-color:var(--accent);}
.chiprow{display:flex; flex-wrap:wrap; gap:8px;}
.selectchip{
  padding:9px 14px; border-radius:var(--radius-pill); border:1.5px solid var(--border); background:var(--surface);
  font-size:13px; font-weight:600; cursor:pointer; color:var(--text-soft);
}
.selectchip.sel{border-color:var(--accent); background:var(--accent-bg); color:var(--copper-600);}

/* ============================= AI INPUT / CHAT ============================= */
.ai-input-card{
  background:linear-gradient(180deg,var(--surface),var(--surface)); border:1.5px solid var(--border); border-radius:var(--radius-l);
  padding:14px; box-shadow:var(--shadow-sm);
}
.ai-input-card textarea{border:none; padding:6px 2px; font-size:15px; min-height:52px; background:transparent;}
.ai-input-card textarea:focus{border:none; outline:none;}
.ai-input-row{display:flex; align-items:center; gap:8px; margin-top:8px;}
.ai-spark{width:26px;height:26px;border-radius:50%;background:var(--accent-bg); display:flex;align-items:center;justify-content:center; flex:0 0 auto;}
.chat{display:flex; flex-direction:column; gap:14px; padding:14px 16px 10px;}
.bubble-user{align-self:flex-end; background:var(--ink-700); color:#fff; padding:11px 14px; border-radius:16px 16px 4px 16px; max-width:82%; font-size:14px; line-height:1.45;}
.bubble-ai{align-self:flex-start; max-width:92%; display:flex; gap:8px;}
.bubble-ai .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-bg); display:flex;align-items:center;justify-content:center; flex:0 0 auto; margin-top:2px;}
.bubble-ai .content{background:var(--surface-alt); padding:11px 14px; border-radius:16px 16px 16px 4px; font-size:14px; line-height:1.5; color:var(--text);}
.typing{display:flex; gap:4px; padding:4px 0;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint); animation:blink 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.18s;} .typing span:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

/* ============================= TIMELINE ============================= */
.timeline{display:flex; flex-direction:column;}
.tl-step{display:flex; gap:12px; position:relative;}
.tl-marker{display:flex; flex-direction:column; align-items:center; width:22px; flex:0 0 auto;}
.tl-dot{width:14px;height:14px;border-radius:50%; border:2.5px solid var(--border); background:var(--surface); flex:0 0 auto;}
.tl-dot.done{background:var(--success-600); border-color:var(--success-600);}
.tl-dot.now{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-bg);}
.tl-line{width:2px; flex:1; background:var(--border); min-height:22px;}
.tl-line.done{background:var(--success-600);}
.tl-body{padding-bottom:22px; flex:1; min-width:0;}
.tl-title{font-weight:700; font-size:13.5px;}
.tl-title.faint{color:var(--text-faint); font-weight:600;}
.tl-desc{font-size:12.5px; color:var(--text-faint); margin-top:2px; line-height:1.4;}

/* ============================= EMPTY STATE ============================= */
.empty{display:flex; flex-direction:column; align-items:center; text-align:center; padding:44px 26px; gap:12px;}
.empty .ic{width:56px;height:56px;border-radius:18px;background:var(--surface-alt); display:flex; align-items:center; justify-content:center; margin-bottom:4px;}
.empty h3{font-size:16px;}
.empty p{font-size:13.5px; color:var(--text-faint); line-height:1.5; max-width:280px;}

/* ============================= SKELETON ============================= */
.sk{background:linear-gradient(90deg,var(--surface-alt) 25%,var(--border) 37%,var(--surface-alt) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px;}
@keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}

/* ============================= PRODUCT CARD ============================= */
.pcard{width:150px; flex:0 0 auto; scroll-snap-align:start;}
.pcard .thumb, .pcard-row .thumb{aspect-ratio:1/1; border-radius:var(--radius-m); background:var(--surface-alt); display:flex; align-items:center; justify-content:center; color:var(--text-faint); overflow:hidden;}
.pcard .thumb{width:150px;}
.pname{font-weight:600; font-size:13px; line-height:1.3; margin-top:8px;}
.pmeta{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap;}
.pprice{font-family:var(--font-mono); font-weight:600; font-size:14px; margin-top:2px;}
.pcard-row{display:flex; gap:12px;}
.pcard-row .thumb{width:76px; height:76px; flex:0 0 auto;}
.pcard-row .info{flex:1; min-width:0;}

/* ============================= BOTTOM SHEET ============================= */
.overlay{position:absolute; inset:0; background:rgba(10,14,24,.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .18s ease;}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:22px 22px 0 0; z-index:51;
  transform:translateY(102%); transition:transform .22s cubic-bezier(.32,.72,0,1); max-height:82%; display:flex; flex-direction:column;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border); border-radius:99px; margin:10px auto 4px;}
.sheet-body{overflow-y:auto; padding:6px 16px 22px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:8px 16px 4px;}

/* ============================= TOAST ============================= */
.toast{
  position:absolute; left:16px; right:16px; bottom:88px; background:var(--ink-900); color:var(--steel-050);
  padding:12px 16px; border-radius:var(--radius-m); font-size:13.5px; font-weight:600; z-index:70; display:flex; align-items:center; gap:10px;
  box-shadow:var(--shadow-md); opacity:0; transform:translateY(10px); transition:all .22s ease; pointer-events:none;
}
:root:not([data-theme="light"]) .toast{background:var(--copper-500); color:#241305;}
:root[data-theme="dark"] .toast{background:var(--copper-500); color:#241305;}
.toast.show{opacity:1; transform:translateY(0);}

/* ============================= MISC ============================= */
.divider{height:1px; background:var(--border); border:none; margin:2px 0;}
.hero{padding:22px 16px 14px;}
.hero h1{font-size:24px; line-height:1.2;}
.hero .kicker{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px;}
.badge-count{background:var(--accent); color:var(--on-accent); font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:99px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px;}
.progress{height:6px; border-radius:99px; background:var(--surface-alt); overflow:hidden;}
.progress i{display:block; height:100%; background:var(--accent); border-radius:99px;}
.avatar-ph{width:52px;height:52px;border-radius:50%; background:var(--ink-700); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:18px;}
.kv{display:flex; justify-content:space-between; font-size:13.5px; padding:9px 0;}
.kv .k{color:var(--text-faint);}
.kv .v{font-weight:600; font-family:var(--font-mono);}
.upload-slot{border:1.5px dashed var(--border); border-radius:var(--radius-m); padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer;}
.filechip{display:flex; align-items:center; gap:8px; background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 10px; font-size:12.5px; font-weight:600;}

/* ============================= CONSOLE / SYSTEM HUD (scan + extraction) ============================= */
.console{
  background:#130E09; color:#EFE7DC; border-radius:var(--radius-l); padding:16px; border:1px solid #3A2C1C;
  font-family:var(--font-mono); position:relative; overflow:hidden;
  background-image:linear-gradient(rgba(229,138,69,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(229,138,69,.09) 1px,transparent 1px);
  background-size:16px 16px;
}
.console-head{display:flex; align-items:center; justify-content:space-between; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#B5A896; margin-bottom:12px;}
.console-head .dot{width:6px; height:6px; border-radius:50%; background:#E58A45; box-shadow:0 0 0 3px rgba(229,138,69,.25); display:inline-block; margin-right:7px;}
.console-row{display:flex; align-items:center; gap:9px; padding:5px 0; font-size:12px;}
.console-row .ok{color:#8FE3A0;}
.console-row .warn{color:#F2B75E;}
.console-big{font-family:var(--font-mono); font-weight:700; font-size:30px; color:#F2A25F;}
</style>

/* =====================================================================
   SERVICES — the only layer that touches data. Every function is async
   and returns a fresh copy, so a real backend can drop in behind this
   exact same interface later without any screen code changing.
   ===================================================================== */
const Services = {
  async listProducts({category,query}={}){
    await delay(220);
    let out = PRODUCTS;
    if(category) out = out.filter(p=>p.category===category);
    if(query){ const q=query.toLowerCase(); out = out.filter(p=> p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.category.includes(q)); }
    return out;
  },
  async getProduct(id){ await delay(120); return PRODUCTS.find(p=>p.id===id); },
  async similarProducts(id){ await delay(150); const p=PRODUCTS.find(x=>x.id===id); return PRODUCTS.filter(x=>x.category===p.category && x.id!==id).slice(0,4); },

  async aiSearch(text){
    await delay(650);
    const q=text.toLowerCase();
    const hits = PRODUCTS.filter(p=> q.split(/\s+/).some(w=>w.length>3 && (p.name.toLowerCase().includes(w)||p.category.includes(w)||p.desc.toLowerCase().includes(w))) );
    if(hits.length>=3) return {kind:'exact', products:hits.slice(0,6)};
    if(hits.length>0) return {kind:'similar', products:hits.slice(0,6)};
    return {kind:'none', products:[]};
  },

  async aiParseBuild(text){
    await delay(1100);
    const scenario = matchBuildScenario(text) || genericBuildScenario(text);
    return scenario;
  },

  async aiParseCustomRequest(text){
    await delay(900);
    const t = text.toLowerCase();
    const material = /aluminum|aluminium/.test(t)?'Aluminum': /steel/.test(t)?'Stainless Steel': /plastic|abs|polymer/.test(t)?'ABS Polymer': /wood/.test(t)?'Wood':'Not specified';
    const waterproof = /waterproof|ip6|ip7/.test(t);
    const qtyMatch = t.match(/(\d[\d,]*)\s*(units|pcs|pieces)?/);
    return {
      component: text.length>60? text.slice(0,60)+'…': text,
      material, dims:'Not specified',
      quantity: qtyMatch? qtyMatch[1]+' units' : 'Not specified',
      finish: waterproof? 'Sealed / waterproof finish':'Not specified',
      timeline:'30 days (estimated)',
    };
  },

  createProject({name,prompt,scenario}){
    const requirements = scenario.groups.flatMap(g=>g.items.map(it=>({id:uid('req'), group:g.group, ...it})));
    const productIds = requirements.filter(r=>r.matchedProductId).map(r=>r.matchedProductId);
    const project = {id:uid('proj'), name:name||scenario.label, prompt, createdAt:Date.now(), requirements, productIds, customRequestIds:[]};
    Store.state.projects.unshift(project);
    return project;
  },

  submitCustomRequest(data){
    const cr = {id:uid('cr'), status:'submitted', files:[], ...data};
    Store.state.customRequests.unshift(cr);
    if(data.projectId){ const p=Store.state.projects.find(x=>x.id===data.projectId); if(p) p.customRequestIds.push(cr.id); }
    return cr;
  },

  submitOpportunity(data){
    const deal = {id:uid('d'), status:'submitted', commission: Math.round((data.value||0)*0.06), createdAt:Date.now(), ...data};
    Store.state.deals.unshift(deal);
    return deal;
  },

  addToCart(productId, qty){
    const line = Store.state.cart.find(c=>c.productId===productId);
    if(line) line.qty += qty; else Store.state.cart.push({productId, qty});
  },

  async scanCatalogue(fileName){
    const total = 300 + Math.floor(Math.random()*80);
    const needMoq = 8+Math.floor(Math.random()*8);
    const needPrice = 4+Math.floor(Math.random()*6);
    const needSpec = 2+Math.floor(Math.random()*5);
    return {fileName, total, needMoq, needPrice, needSpec, ready: total-needMoq-needPrice-needSpec};
  },
};

/* =====================================================================
   STORE — single source of truth + tiny router. UI never mutates this
   directly except through the actions below, and always re-renders via
   Store.render() after a change.
   ===================================================================== */
const Store = {
  state:{
    onboarded:false,
    intent:null,           // 'buy' | 'build' | 'earn' — first-run selection
    mode:'buy',             // current active mode
    user:{name:'', email:'', company:'', isPartner:false, isSupplier:false},
    stack:[{screen:'welcome'}],
    cart:[],                 // [{productId, qty}]
    projects: JSON.parse(JSON.stringify(PROJECTS_SEED)),
    customRequests: JSON.parse(JSON.stringify(CUSTOM_REQUESTS_SEED)),
    deals: JSON.parse(JSON.stringify(DEALS_SEED)),
    notifications: JSON.parse(JSON.stringify(NOTIFICATIONS_SEED)),
    orders: JSON.parse(JSON.stringify(ORDERS_SEED)),
    _tmp:{}, // scratch space for in-flight flows (custom request draft, build draft, etc.)
  },

  ROOT_SCREENS:{ buy:'buyHome', build:'buildHome', earn:'earnHome' },
  TAB_OF:{ buyHome:'home', buildHome:'home', earnHome:'home', discover:'discover', projects:'projects', activity:'activity', you:'you' },

  current(){ return this.state.stack[this.state.stack.length-1]; },

  navigate(screen, params={}){
    this.state.stack.push({screen, params});
    this.render();
  },
  replace(screen, params={}){
    this.state.stack[this.state.stack.length-1] = {screen, params};
    this.render();
  },
  back(){
    if(this.state.stack.length>1) this.state.stack.pop();
    this.render();
  },
  goTab(screen){
    this.state.stack = [{screen}];
    this.render();
  },
  setMode(mode){
    this.state.mode = mode;
    this.closeSheet();
    this.state.stack = [{screen:this.ROOT_SCREENS[mode]}];
    this.render();
  },
  isRoot(screen){ return !!this.TAB_OF[screen]; },

  toast(msg, ic='check'){
    const t=$('#toast');
    t.innerHTML = icon(ic,16)+`<span>${esc(msg)}</span>`;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  },
  openSheet(html){
    $('#sheet-content').innerHTML = html;
    $('#overlay').classList.add('show');
    $('#sheet').classList.add('show');
  },
  closeSheet(){
    $('#overlay').classList.remove('show');
    $('#sheet').classList.remove('show');
  },

  cartCount(){ return this.state.cart.reduce((n,c)=>n+c.qty,0); },
  cartTotal(){ return this.state.cart.reduce((sum,c)=>{const p=PRODUCTS.find(x=>x.id===c.productId); return sum+(p?p.price*c.qty:0);},0); },
  unreadCount(){ return this.state.notifications.filter(n=>!n.read).length; },

  render(){
    const {screen, params} = this.current();
    const def = Screens[screen];
    if(!def){ $('#screen-root').innerHTML = `<div class="empty"><h3>Screen not found: ${esc(screen)}</h3></div>`; return; }
    $('#topbar-slot').innerHTML = def.topbar ? def.topbar(params) : Components.topBar({title:''});
    $('#screen-root').innerHTML = def.render(params) || '';
    $('#screen-root').scrollTop = 0;
    $('#nav-slot').innerHTML = this.isRoot(screen) ? Components.bottomNav(screen) : '';
    if(def.after) def.after(params);
  }
};

  hazard(){ return `<span class="hazard"></span>`; },
  topBar({title, sub, back=false, showMode=false, right=''}){
    return `<div class="topbar">
      ${back?`<button class="topbar-icon" data-action="back">${icon('back',18)}</button>`:''}
      <div style="flex:1;min-width:0;">
        <div class="topbar-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(title||'')}</div>
        ${sub?`<div class="topbar-sub">${esc(sub)}</div>`:''}
      </div>
      ${showMode?Components.modePill():''}
      ${right}
    </div>`;
  },
  notifBell(){
    const n = Store.unreadCount();
    return `<button class="topbar-icon" data-action="tab" data-screen="activity" style="position:relative;">${icon('bell',17)}${n?`<span class="badge-count" style="position:absolute;top:-3px;right:-3px;">${n}</span>`:''}</button>`;
  },
  modePill(){
    const m = MODE_META[Store.state.mode];
    return `<button class="mode-pill" data-action="open-mode-sheet">
      <span class="swatch" style="background:var(--accent-bg);color:var(--copper-600)">${icon(m.icon,12)}</span>
      <span class="lbl">${m.label}</span><span class="car">${icon('chevrondown',10)}</span>
    </button>`;
  },
  bottomNav(active){
    const tab = Store.TAB_OF[active];
    const items = [
      {id:'home', label:'Home', icon:'home', screen:Store.ROOT_SCREENS[Store.state.mode]},
      {id:'discover', label:'Discover', icon:'compass', screen:'discover'},
      {id:'projects', label:'Projects', icon:'layers', screen:'projects'},
      {id:'activity', label:'Activity', icon:'activity', screen:'activity'},
      {id:'you', label:'You', icon:'user', screen:'you'},
    ];
    return `<nav class="bottomnav">${items.map(it=>`
      <button class="navitem ${tab===it.id?'active':''}" data-action="tab" data-screen="${it.screen}">
        ${icon(it.icon,21)}<span>${it.label}</span>
        ${it.id==='activity'&&Store.unreadCount()?`<span class="badge-count" style="position:relative;top:-14px;left:14px;">${Store.unreadCount()}</span>`:''}
      </button>`).join('')}
    </nav>`;
  },
  modeSheet(){
    return `<div class="sheet-head"><h3 style="font-size:16px;">Switch mode</h3><button class="topbar-icon" data-action="close-sheet">${icon('close',16)}</button></div>
    <div class="sheet-body stack">
      <p style="font-size:12.5px;color:var(--text-faint);margin-bottom:2px;">One account. Move between modes anytime — nothing is locked.</p>
      ${Object.entries(MODE_META).map(([key,m])=>`
        <button class="card card-pad tap" data-action="set-mode" data-mode="${key}" style="display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid ${Store.state.mode===key?'var(--accent)':'var(--border)'};background:${Store.state.mode===key?'var(--accent-bg)':'var(--surface)'};">
          <span class="iconbtn" style="background:var(--surface);color:var(--copper-600);">${icon(m.icon,18)}</span>
          <span style="flex:1;"><div style="font-weight:700;font-size:14.5px;">${m.label}</div><div style="font-size:12.5px;color:var(--text-faint);">${m.desc}</div></span>
          ${Store.state.mode===key?icon('check',18):''}
        </button>`).join('')}
    </div>`;
  },

  chip(status, textOverride){
    const map = {
      available:{cls:'chip-available', label:'Available', ic:'check'},
      similar:{cls:'chip-similar', label:'Similar option', ic:null},
      custom:{cls:'chip-custom', label:'Custom', ic:null},
      info:{cls:'chip-info', label:'Need info', ic:null},
      neutral:{cls:'chip-neutral', label:'', ic:null},
      danger:{cls:'chip-danger', label:'', ic:null},
    };
    const m = map[status]||map.neutral;
    return `<span class="chip ${m.cls}"><span class="dot"></span>${esc(textOverride||m.label)}</span>`;
  },

  productCardGrid(p, opts={}){
    return `<div class="pcard tap" data-action="open-product" data-id="${p.id}">
      <div class="thumb">${icon(productIcon(p.category),30)}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="pprice">${money(p.price)}<span style="color:var(--text-faint);font-weight:500;">/unit</span></div>
      <div class="pmeta"><span>MOQ ${p.moq.toLocaleString()}</span><span>·</span><span>${p.leadTimeDays}d lead</span></div>
    </div>`;
  },
  productCardRow(p, opts={}){
    return `<div class="card card-pad tap pcard-row" data-action="open-product" data-id="${p.id}">
      <div class="thumb">${icon(productIcon(p.category),26)}</div>
      <div class="info">
        <div class="pname" style="margin-top:0;">${esc(p.name)}</div>
        <div class="pmeta" style="margin-top:5px;"><span>MOQ ${p.moq.toLocaleString()}</span><span>·</span><span>${p.leadTimeDays}d lead</span><span>·</span><span>${esc(p.stock)}</span></div>
        <div class="pprice" style="margin-top:5px;">${money(p.price)}<span style="color:var(--text-faint);font-weight:500;font-family:var(--font-body);"> /unit</span></div>
      </div>
      ${opts.showAdd?`<button class="iconbtn" data-action="add-cart" data-id="${p.id}" title="Add to cart">${icon('plus',16)}</button>`:''}
    </div>`;
  },

  requirementRow(req, opts={}){
    const statusIcon = {available:'check', similar:null, custom:'plus', info:null}[req.status];
    return `<div class="card card-pad tap" data-action="open-requirement" data-id="${req.id}" data-project="${opts.projectId||''}" style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div style="font-weight:600;font-size:14px;flex:1;min-width:0;">${esc(req.name)}</div>
        ${Components.chip(req.status)}
      </div>
      <div class="tag">${esc(req.group)}</div>
      ${req.note?`<div style="font-size:12.5px;color:var(--text-faint);line-height:1.4;">${esc(req.note)}</div>`:''}
    </div>`;
  },

  projectCard(proj){
    const total = proj.requirements.length;
    const avail = proj.requirements.filter(r=>r.status==='available').length;
    const review = proj.requirements.filter(r=>r.status==='similar'||r.status==='info').length;
    const custom = proj.requirements.filter(r=>r.status==='custom').length;
    const pct = total? Math.round(avail/total*100):0;
    return `<div class="card card-pad tap" data-action="open-project" data-id="${proj.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div>
          <div style="font-family:var(--font-display);font-weight:700;font-size:15.5px;">${esc(proj.name)}</div>
          <div style="font-size:12px;color:var(--text-faint);margin-top:2px;">Updated ${timeAgo(proj.createdAt)}</div>
        </div>
        ${icon('chevron',16)}
      </div>
      <div class="progress" style="margin-top:12px;"><i style="width:${pct}%"></i></div>
      <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--text-faint);"><b style="color:var(--text);font-family:var(--font-mono);">${total}</b> requirements</span>
        <span style="font-size:12px;color:var(--success-600);"><b style="font-family:var(--font-mono);">${avail}</b> available</span>
        <span style="font-size:12px;color:var(--teal-600);"><b style="font-family:var(--font-mono);">${review}</b> review</span>
        <span style="font-size:12px;color:var(--copper-600);"><b style="font-family:var(--font-mono);">${custom}</b> custom</span>
      </div>
    </div>`;
  },

  customRequestCard(cr){
    const idx = REQUEST_STAGES.indexOf(cr.status);
    return `<div class="card card-pad tap" data-action="open-request" data-id="${cr.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
        <div style="font-weight:700;font-size:14px;flex:1;">${esc(cr.title)}</div>
        ${icon('chevron',16)}
      </div>
      <div style="font-size:12.5px;color:var(--text-faint);margin-top:4px;line-height:1.4;">${esc(cr.description)}</div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
        <span class="chip chip-neutral">${REQUEST_STAGE_LABEL[cr.status]}</span>
        <span class="tag" style="margin-left:auto;">${idx+1}/${REQUEST_STAGES.length}</span>
      </div>
    </div>`;
  },

  dealCard(d){
    return `<div class="card card-pad tap" data-action="open-deal" data-id="${d.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
        <div>
          <div style="font-weight:700;font-size:14.5px;">${esc(d.customer)}</div>
          <div style="font-size:12.5px;color:var(--text-faint);margin-top:2px;">${esc(d.need)}</div>
        </div>
        ${icon('chevron',16)}
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
        <span class="chip ${d.status==='won'?'chip-available':d.status==='lost'?'chip-danger':'chip-neutral'}">${DEAL_STAGE_LABEL[d.status]}</span>
        <span style="margin-left:auto;font-family:var(--font-mono);font-size:13px;font-weight:600;">${money(d.value)}</span>
      </div>
    </div>`;
  },

  timeline(stages, labels, descs, currentKey, extraNote){
    const idx = stages.indexOf(currentKey);
    return `<div class="timeline">${stages.map((s,i)=>{
      const done = i<idx, now = i===idx;
      return `<div class="tl-step">
        <div class="tl-marker"><div class="tl-dot ${done?'done':now?'now':''}"></div>${i<stages.length-1?`<div class="tl-line ${done?'done':''}"></div>`:''}</div>
        <div class="tl-body">
          <div class="tl-title ${!(done||now)?'faint':''}">${labels[s]}</div>
          ${now?`<div class="tl-desc">${descs[s]}${extraNote?' '+extraNote:''}</div>`:''}
        </div>
      </div>`;
    }).join('')}</div>`;
  },

  emptyState({icon:ic='box', title, body, ctaLabel, ctaAction, ctaData=''}){
    return `<div class="empty">
      <div class="ic">${icon(ic,26)}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>
      ${ctaLabel?`<button class="btn btn-accent" style="width:auto;margin-top:6px;padding:12px 20px;" data-action="${ctaAction}" ${ctaData}>${esc(ctaLabel)}</button>`:''}
    </div>`;
  },

  aiUserMsg(text){ return `<div class="bubble-user">${esc(text)}</div>`; },
  aiMsg(html){ return `<div class="bubble-ai"><div class="avatar">${icon('sparkle',14)}</div><div class="content">${html}</div></div>`; },
  aiTyping(){ return `<div class="bubble-ai"><div class="avatar">${icon('sparkle',14)}</div><div class="content typing"><span></span><span></span><span></span></div></div>`; },

  uploadRow(){
    return `<div class="chiprow">
      <button class="selectchip" data-action="mock-upload" data-kind="Image" type="button">${icon('image',14)} Image</button>
      <button class="selectchip" data-action="mock-upload" data-kind="Document" type="button">${icon('doc',14)} Document</button>
      <button class="selectchip" data-action="mock-upload" data-kind="CAD file" type="button">${icon('box',14)} CAD</button>
      <button class="selectchip" data-action="mock-voice" type="button">${icon('mic',14)} Voice</button>
    </div>`;
  },
  fileList(files, removable){
    if(!files||!files.length) return '';
    return `<div class="chiprow">${files.map((f,i)=>`<span class="filechip">${icon('file',13)} ${esc(f)} ${removable?`<span data-action="remove-file" data-idx="${i}" style="cursor:pointer;color:var(--text-faint);">${icon('close',12)}</span>`:''}</span>`).join('')}</div>`;
  },

  requirementGroupBlock(scenario, groupsWithStatus){
    return groupsWithStatus.map(g=>`
      <div style="margin-bottom:4px;">
        <div class="tag" style="margin:14px 0 8px;">${esc(g.group)}</div>
        <div class="stack">${g.items.map(it=>`
          <div class="card card-pad" style="display:flex;align-items:center;gap:10px;">
            <span style="flex:1;font-size:13.5px;font-weight:500;">${esc(it.name)}</span>
            ${Components.chip(it.status)}
          </div>`).join('')}</div>
      </div>`).join('');
  },
};

function pushChat(role, html){ Store.state._tmp.chat.push({role, html}); renderChat(); $('#chat-log').scrollTop = $('#chat-log').scrollHeight; }
function renderChat(){
  const log = $('#chat-log'); if(!log) return;
  log.innerHTML = Store.state._tmp.chat.map(m=> m.role==='user'? Components.aiUserMsg(m.html) : m.role==='typing'? Components.aiTyping() : Components.aiMsg(m.html)).join('');
}
async function handleChatSend(){
  const ta = $('#chat-input'); const text = ta.value.trim(); if(!text) return;
  ta.value='';
  pushChat('user', text);
  Store.state._tmp.chat.push({role:'typing'}); renderChat();
  const scenario = await Services.aiParseBuild(text);
  Store.state._tmp.chat.pop();
  Store.state._tmp.lastPrompt = text; Store.state._tmp.lastScenario = scenario;
  const flat = scenario.groups.flatMap(g=>g.items);
  const avail = flat.filter(i=>i.status==='available').length, custom = flat.filter(i=>i.status==='custom').length;
  pushChat('ai', `Got it — <b>${esc(scenario.label)}</b>. ${esc(scenario.summary)}<br><br>I matched <b>${avail}</b> of ${flat.length} requirements to products already in our network` + (custom? `, and found <b>${custom}</b> that will need a custom request.`:'.') + `<div style="margin-top:10px;"><button class="btn btn-accent btn-sm" data-action="view-requirements">${icon('layers',14)} View structured requirements</button></div>`);
}

      </div>
      <div class="console">
        <div class="console-row"><span class="warn">⚠</span><span style="flex:1;">${r.needMoq} products need MOQ information</span></div>
        <div class="console-row"><span class="warn">⚠</span><span style="flex:1;">${r.needPrice} products need price confirmation</span></div>
        <div class="console-row"><span class="warn">⚠</span><span style="flex:1;">${r.needSpec} products have incomplete specifications</span></div>
      </div>
      <button class="btn btn-primary" data-action="nav" data-screen="exceptionReview" data-params='${esc(JSON.stringify(r))}'>Review ${r.needMoq+r.needPrice+r.needSpec} Items</button>
      <button class="btn btn-secondary" data-action="submit-ready" data-count="${r.ready}">Submit ${r.ready} Ready Products</button>
    </div>`;
  }
};

Screens.exceptionReview = {
  topbar:()=>Components.topBar({title:'Exceptions', back:true}),
  render(r){
    const items=[];
    for(let i=0;i<r.needMoq;i++) items.push({name:`Product ${i+1}`, issue:'Missing MOQ', field:'MOQ', ic:'clip'});
    for(let i=0;i<r.needPrice;i++) items.push({name:`Product ${r.needMoq+i+1}`, issue:'Price needs confirmation', field:'Price', ic:'coins'});
    for(let i=0;i<r.needSpec;i++) items.push({name:`Product ${r.needMoq+r.needPrice+i+1}`, issue:'Incomplete specifications', field:'Specs', ic:'file'});
    return `<div class="pad">
      <p style="font-size:13px;color:var(--text-faint);line-height:1.5;">AI handled bulk extraction — you only need to review these ${items.length} exceptions.</p>
    </div>
    <div class="pad stack" style="padding-top:0;padding-bottom:20px;">
      ${items.map((it,i)=>`<div class="card card-pad" style="display:flex;align-items:center;gap:10px;">
        <span class="iconbtn" style="width:34px;height:34px;">${icon(it.ic,16)}</span>
        <span style="flex:1;"><div style="font-weight:600;font-size:13.5px;">${it.name}</div><div style="font-size:12px;color:var(--warning-600);margin-top:2px;">${it.issue}</div></span>
        <input class="input" style="width:84px;padding:8px;font-size:12.5px;" placeholder="${it.field}">
      </div>`).join('')}
      <button class="btn btn-primary" data-action="submit-exceptions" data-count="${items.length}">Save &amp; Submit All</button>
    </div>`;
  }
};

/* =====================================================================
   AI CANNED REPLIES — Level 2 contextual AI (product / cart / project)
   ===================================================================== */
function productAiReply(q, p){
  const t=q.toLowerCase();
  if(t.includes('compat')||t.includes('use this')) return `Yes — the <b>${esc(p.name)}</b> is compatible with most builds in its category. If your project has specific tolerances, share them and I'll double-check fit.`;
  if(t.includes('differ')||t.includes('alternative')) return `Compared to similar parts in <b>${CATEGORIES.find(c=>c.id===p.category)?.name}</b>, this one has a shorter lead time (${p.leadTimeDays}d) at a slightly higher unit price. I can pull up a side-by-side if that helps.`;
  return `Here's what stands out about the <b>${esc(p.name)}</b>: ${p.leadTimeDays}-day lead time, MOQ of ${p.moq.toLocaleString()}, and ${esc(p.stock).toLowerCase()}. Ask me anything else about it.`;
}

/* =====================================================================
   DISPATCHER — single delegated click handler for the whole app.
   ===================================================================== */
function readParams(el){
  const p = el.dataset.params ? JSON.parse(el.dataset.params) : {};
  if(el.dataset.id) p.id = el.dataset.id;
  if(el.dataset.mode) p.mode = el.dataset.mode;
  if(el.dataset.prefill) p.prefill = el.dataset.prefill;
  if(el.dataset.project) p.project = el.dataset.project;
  return p;
}

document.getElementById('app').addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'pick-intent':
      Store.state.intent = el.dataset.intent;
      Store.render();
      break;
    case 'go-account':
      Store.navigate('accountCreate');
      break;
    case 'submit-account': {
      Store.state.user.name = $('#f-name').value.trim() || 'Alex Rivera';
      Store.state.user.email = $('#f-email').value.trim() || 'alex@company.com';
      Store.navigate(INTENT_QUICKSTART[Store.state.intent] || 'quickStartBuy');
      break;
    }
    case 'finish-onboarding': {
      const mode = el.dataset.mode || Store.state.intent || 'buy';
      Store.state.onboarded = true;
      Store.state.mode = mode;
      const goto = el.dataset.goto;
      Store.state.stack = goto ? [{screen:Store.ROOT_SCREENS[mode]},{screen:goto}] : [{screen:Store.ROOT_SCREENS[mode]}];
      Store.render();
      break;
    }
    case 'back': Store.back(); break;
    case 'tab': Store.goTab(el.dataset.screen); break;
    case 'nav': Store.navigate(el.dataset.screen, readParams(el)); break;
    case 'nav-replace': Store.replace(el.dataset.screen, readParams(el)); break;
    case 'open-mode-sheet': Store.openSheet(Components.modeSheet()); break;
    case 'close-sheet': Store.closeSheet(); break;
    case 'set-mode': Store.setMode(el.dataset.mode); break;

    case 'fill-build': {
      const ta = $('#build-prompt'); if(ta) ta.value = el.dataset.text;
      break;
    }
    case 'start-build': {
      const text = ($('#build-prompt')?.value || '').trim();
      if(!text){ Store.toast('Describe what you\'re building first','sparkle'); break; }
      el.disabled = true; el.innerHTML = 'Thinking…';
      const scenario = await Services.aiParseBuild(text);
      Store.state._tmp.lastPrompt = text; Store.state._tmp.lastScenario = scenario;
      Store.state.onboarded = true; Store.state.mode = 'build';
      Store.state.stack = [{screen:'buildHome'},{screen:'requirementList'}];
      Store.render();
      break;
    }

    case 'quick-query': {
      const text = el.dataset.text;
      Store.navigate('discover');
      await delay(30);
      const ta = $('#discover-q'); if(ta) ta.value = text;
      break;
    }
    case 'run-search': {
      const q = ($('#discover-q')?.value||'').trim();
      if(!q){ Store.toast('Type or describe what you need','search'); break; }
      el.disabled = true;
      const res = await Services.aiSearch(q);
      el.disabled = false;
      Store.navigate('searchResults', {kind:res.kind, products:res.products, query:q});
      break;
    }
    case 'search-category': {
      const products = await Services.listProducts({category:el.dataset.id});
      Store.navigate('searchResults', {kind: products.length?'exact':'none', products, query: CATEGORIES.find(c=>c.id===el.dataset.id)?.name});
      break;
    }

    case 'open-product': Store.navigate('productDetail', {id:el.dataset.id}); break;
    case 'add-cart': {
      const p = PRODUCTS.find(x=>x.id===el.dataset.id);
      Services.addToCart(p.id, p.moq);
      Store.toast('Added to cart');
      Store.render();
      break;
    }
    case 'add-cart-qty': {
      const p = PRODUCTS.find(x=>x.id===el.dataset.id);
      const qtyEl = $('#qty-'+p.id);
      const qty = Math.max(p.moq, parseInt(qtyEl?.value||p.moq,10)||p.moq);
      Services.addToCart(p.id, qty);
      Store.toast('Added to cart');
      break;
    }
    case 'request-quote': {
      Store.toast('Quote requested — we\'ll follow up shortly','check');
      break;
    }
    case 'open-cart': Store.navigate('cart'); break;
    case 'remove-cart': {
      Store.state.cart = Store.state.cart.filter(c=>c.productId!==el.dataset.id);
      Store.render();
      break;
    }
    case 'place-order': {
      Store.state.orders.unshift({id:uid('o'), name:Store.cartCount()+' items', total:Store.cartTotal(), status:'Submitted', date:Date.now()});
      Store.state.cart = [];
      Store.toast('Order placed');
      Store.goTab('buyHome');
      break;
    }

    case 'open-ai-product': {
      const p = PRODUCTS.find(x=>x.id===el.dataset.id);
      Store.openSheet(`<div class="sheet-head"><h3 style="font-size:16px;">${icon('sparkle',16)} Ask AI</h3><button class="topbar-icon" data-action="close-sheet">${icon('close',16)}</button></div>
        <div class="sheet-body stack">
          <div class="chiprow">
            <button class="selectchip" data-action="ask-product-ai" data-id="${p.id}" data-q="Can I use this for my project?" type="button">Can I use this for my project?</button>
            <button class="selectchip" data-action="ask-product-ai" data-id="${p.id}" data-q="What is the difference between these options?" type="button">Compare options</button>
            <button class="selectchip" data-action="ask-product-ai" data-id="${p.id}" data-q="Show alternatives." type="button">Show alternatives</button>
          </div>
          <div id="product-ai-reply"></div>
        </div>`);
      break;
    }
    case 'ask-product-ai': {
      const p = PRODUCTS.find(x=>x.id===el.dataset.id);
      $('#product-ai-reply').innerHTML = Components.aiMsg(productAiReply(el.dataset.q, p));
      break;
    }
    case 'ai-cart-suggest': {
      const cats = [...new Set(Store.state.cart.map(c=>PRODUCTS.find(p=>p.id===c.productId)?.category))];
      const suggestions = PRODUCTS.filter(p=>cats.includes(p.category) && !Store.state.cart.some(c=>c.productId===p.id)).slice(0,3);
      Store.openSheet(`<div class="sheet-head"><h3 style="font-size:16px;">${icon('sparkle',16)} What else do I need?</h3><button class="topbar-icon" data-action="close-sheet">${icon('close',16)}</button></div>
        <div class="sheet-body stack">
          <p style="font-size:12.5px;color:var(--text-faint);">Based on what's in your cart, teams often also add:</p>
          ${suggestions.map(p=>Components.productCardRow(p,{showAdd:true})).join('') || '<p style="font-size:13px;">Your cart already looks complete.</p>'}
        </div>`);
      break;
    }

    case 'add-project-available': {
      const proj = Store.state.projects.find(p=>p.id===el.dataset.id);
      let n=0;
      proj.requirements.filter(r=>r.status==='available'&&r.matchedProductId).forEach(r=>{ const p=PRODUCTS.find(x=>x.id===r.matchedProductId); Services.addToCart(p.id,p.moq); n++; });
      Store.toast(n+' items added to cart');
      break;
    }
    case 'project-tab': Store.replace('projectOverview', {id:el.dataset.id, tab:el.dataset.tab}); break;
    case 'open-project': Store.navigate('projectOverview', {id:el.dataset.id, tab:'overview'}); break;
    case 'open-requirement': Store.navigate('requirementDetail', {reqId:el.dataset.id, projectId:el.dataset.project}); break;
    case 'req-action': {
      const proj = Store.state.projects.find(p=>p.id===el.dataset.project);
      const req = proj.requirements.find(r=>r.id===el.dataset.id);
      if(el.dataset.kind==='remove'){ proj.requirements = proj.requirements.filter(r=>r.id!==req.id); Store.toast('Removed from project'); Store.back(); }
      else { $('#req-ai-reply').innerHTML = Components.aiMsg(`Looking at similar parts to <b>${esc(req.name)}</b>… the closest alternatives trade a slightly longer lead time for a lower unit price. I can start a custom request if none of our stock options fit.`); }
      break;
    }
    case 'project-ai-quick': {
      const map = {
        'Find cheaper alternatives.': 'I compared unit prices across your matched components — switching the Bluetooth module to a similar lower-cost option could save roughly 18% at your target volume, with a 3-day longer lead time.',
        'Reduce my lead time.': 'Your longest lead-time item is currently at 20 days. Ordering the battery and MCU together from the same production run could shave about 5 days off your critical path.',
        'Explain the missing components.': 'Items marked "Need info" don\'t have enough detail yet to match confidently — usually target quantity or a dimension. Add that in the requirement detail and I\'ll re-match it.',
      };
      $('#proj-ai-reply').innerHTML = Components.aiMsg(map[el.dataset.text] || 'Let me look into that for you.');
      break;
    }
    case 'ask-ai-optimize': Store.toast('AI is re-checking your requirements for savings…','sparkle'); break;
    case 'view-requirements': Store.navigate('requirementList'); break;
    case 'create-project': {
      const scenario = Store.state._tmp.lastScenario;
      const proj = Services.createProject({prompt:Store.state._tmp.lastPrompt, scenario});
      Store.toast('Project created');
      Store.state.stack = [{screen:'buildHome'},{screen:'projectOverview', params:{id:proj.id, tab:'overview'}}];
      Store.render();
      break;
    }

    case 'chat-send': handleChatSend(); break;

    case 'cr-extract': {
      const text = ($('#cr-text')?.value||'').trim();
      if(!text){ Store.toast('Describe what you need made','sparkle'); break; }
      el.disabled = true; el.innerHTML = 'Structuring…';
      const extracted = await Services.aiParseCustomRequest(text);
      extracted.quantity = extracted.quantity==='Not specified' ? 'Prototype' : extracted.quantity;
      Store.state._tmp.crDraft.text = text;
      Store.state._tmp.crDraft.extracted = extracted;
      Store.render();
      break;
    }
    case 'cr-qty': { Store.state._tmp.crDraft.extracted.quantity = el.dataset.q; Store.render(); break; }
    case 'cr-submit': {
      const d = Store.state._tmp.crDraft; const x = d.extracted;
      const cr = Services.submitCustomRequest({
        title: x.component, description: d.text,
        material: $('#cr-material')?.textContent.trim() || x.material,
        dims: $('#cr-dims')?.textContent.trim() || x.dims,
        finish: $('#cr-finish')?.textContent.trim() || x.finish,
        timeline: $('#cr-timeline')?.textContent.trim() || x.timeline,
        quantity: x.quantity, files:d.files, projectId: d.project || null,
      });
      Store.state._tmp.crDraft = null;
      Store.toast('Request submitted');
      Store.replace('customRequestReview', {id:cr.id});
      break;
    }
    case 'cr-approve': { const cr=Store.state.customRequests.find(c=>c.id===el.dataset.id); cr.status='approved'; Store.toast('Quote approved'); Store.render(); break; }
    case 'cr-provide-info': { const cr=Store.state.customRequests.find(c=>c.id===el.dataset.id); cr.status='feasibility'; Store.toast('Info received — thanks!'); Store.render(); break; }
    case 'cr-advance-demo': {
      const cr=Store.state.customRequests.find(c=>c.id===el.dataset.id);
      const i = REQUEST_STAGES.indexOf(cr.status);
      cr.status = REQUEST_STAGES[Math.min(i+1, REQUEST_STAGES.length-1)];
      Store.render();
      break;
    }

    case 'mock-upload': {
      const name = (el.dataset.kind||'file').toLowerCase().replace(/\s+/g,'-') + '-' + Math.floor(Math.random()*90+10) + (el.dataset.kind==='Image'?'.jpg':el.dataset.kind==='CAD file'?'.step':'.pdf');
      if(Store.state._tmp.crDraft){ Store.state._tmp.crDraft.files.push(name); Store.render(); }
      else if(el.dataset.project){ const proj=Store.state.projects.find(p=>p.id===el.dataset.project); proj.files=proj.files||[]; proj.files.push(name); Store.render(); }
      else Store.toast('Attached '+name);
      break;
    }
    case 'mock-voice': Store.toast('Voice captured (demo)','mic'); break;
    case 'remove-file': { const d=Store.state._tmp.crDraft; if(d){ d.files.splice(+el.dataset.idx,1); Store.render(); } break; }

    case 'dp-register': {
      Store.state.user.isPartner = true;
      Store.state.user.name = $('#dp-name')?.value.trim() || Store.state.user.name || 'Alex Rivera';
      Store.toast('Welcome, Deal Partner');
      Store.state.mode = 'earn';
      Store.goTab('earnHome');
      break;
    }
    case 'select-chip': {
      $$('.selectchip[data-group="'+el.dataset.group+'"]').forEach(s=>s.classList.remove('sel'));
      el.classList.add('sel');
      break;
    }
    case 'opp-extract': {
      const text = ($('#opp-text')?.value||'').trim();
      if(!text) break;
      const valMatch = text.match(/\$?([\d,]{3,})/);
      $('#opp-need').value = text;
      if(valMatch) $('#opp-value').value = valMatch[1].replace(/,/g,'');
      Store.toast('Filled in from your description','sparkle');
      break;
    }
    case 'opp-submit': {
      const deal = Services.submitOpportunity({
        customer: $('#opp-company')?.value.trim() || 'New opportunity',
        contact: $('#opp-contact')?.value.trim() || 'Contact pending',
        need: $('#opp-need')?.value.trim() || ($('#opp-text')?.value.trim()) || 'Details pending',
        value: parseInt($('#opp-value')?.value,10) || 5000,
        notes: $('#opp-notes')?.value.trim() || '',
      });
      Store.state.user.isPartner = true;
      Store.toast('Opportunity submitted');
      Store.state.mode='earn';
      Store.state.stack = [{screen:'earnHome'},{screen:'dealDetails',params:{id:deal.id}}];
      Store.render();
      break;
    }
    case 'open-deal': Store.navigate('dealDetails', {id:el.dataset.id}); break;
    case 'deal-advance-demo': {
      const d = Store.state.deals.find(x=>x.id===el.dataset.id);
      const i = DEAL_STAGES.indexOf(d.status);
      if(i<DEAL_STAGES.length-1){ d.status = DEAL_STAGES[i+1]; if(d.status==='won') Store.toast('Commission earned!','coins'); }
      Store.render();
      break;
    }

    case 'pilot-submit': {
      Store.toast('Pilot run requested — our manufacturing team will follow up');
      Store.back();
      break;
    }

    case 'nav': break; // handled above

    case 'upload-catalogue': Store.navigate('scanningState', {fileName: el.dataset.kind}); break;
    case 'submit-ready': { Store.state.user.isSupplier=true; Store.toast(el.dataset.count+' products published'); Store.goTab('you'); break; }
    case 'submit-exceptions': { Store.state.user.isSupplier=true; Store.toast('All '+el.dataset.count+' items saved'); Store.goTab('you'); break; }
    case 'gst-submit': { Store.toast('Verification submitted'); Store.navigate('catalogueUpload'); break; }

    case 'restart-onboarding': {
      Store.state.stack = [{screen:'welcome'}];
      Store.state.intent = null;
      Store.render();
      break;
    }
  }
});

$('#overlay').addEventListener('click', ()=>Store.closeSheet());

document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.id==='chat-input' && !e.shiftKey){ e.preventDefault(); handleChatSend(); }
});

/* =====================================================================
   INIT
   ===================================================================== */
Store.render();
</script>
